<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polène Paris — Navy Bucket Bag</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5f0e8;
      font-family: 'Georgia', serif;
      color: #1a1a18;
      padding: 48px 32px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: normal;
      color: #1a1a18;
    }

    header p {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .card:hover { transform: translateY(-2px); }

    .card img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .card-label {
      padding: 12px 16px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-height: 92vh;
      max-width: 92vw;
      object-fit: contain;
    }

    .lightbox-close {
      position: fixed;
      top: 24px;
      right: 32px;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      letter-spacing: 0;
      opacity: 0.7;
      background: none;
      border: none;
    }

    .lightbox-close:hover { opacity: 1; }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      opacity: 0.5;
      background: none;
      border: none;
      padding: 16px;
    }

    .lightbox-nav:hover { opacity: 1; }
    .lightbox-nav.prev { left: 16px; }
    .lightbox-nav.next { right: 16px; }

    .lightbox-counter {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>Polène Paris — Navy Bucket Bag</h1>
    <p>13 generated ads · May 2026</p>
  </header>

  <div class="grid" id="grid"></div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav prev" onclick="navigate(-1)">&#8592;</button>
    <img id="lightbox-img" src="" alt="" />
    <button class="lightbox-nav next" onclick="navigate(1)">&#8594;</button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <script>
    const ads = [
      { ref: "ref-1",  label: "Clean front product shot" },
      { ref: "ref-2",  label: "3/4 angle product shot" },
      { ref: "ref-3",  label: "Open top-down product shot" },
      { ref: "ref-4",  label: "Full body model — bag at hip" },
      { ref: "ref-5",  label: "Full body model — bag on shoulder" },
      { ref: "ref-6",  label: "Torso crop — hands on strap" },
      { ref: "ref-7",  label: "Close-up belt clasp detail" },
      { ref: "ref-8",  label: "Hands holding open bag" },
      { ref: "ref-9",  label: "Full body — black coat, warm background" },
      { ref: "ref-10", label: "Editorial portrait — model looking up" },
      { ref: "ref-11", label: "Floor-level — bag near feet" },
      { ref: "ref-12", label: "Full body coat — bag held at front" },
      { ref: "ref-13", label: "Full body coat — relaxed standing" },
    ];

    const grid = document.getElementById("grid");
    let current = 0;

    ads.forEach((ad, i) => {
      const src = `${ad.ref}/navy-bucket-bag-v1.png`;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<img src="${src}" alt="${ad.label}" /><div class="card-label">${ad.ref} — ${ad.label}</div>`;
      card.addEventListener("click", () => openLightbox(i));
      grid.appendChild(card);
    });

    function openLightbox(i) {
      current = i;
      updateLightbox();
      document.getElementById("lightbox").classList.add("active");
      document.addEventListener("keydown", onKey);
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
      document.removeEventListener("keydown", onKey);
    }

    function navigate(dir) {
      current = (current + dir + ads.length) % ads.length;
      updateLightbox();
    }

    function updateLightbox() {
      document.getElementById("lightbox-img").src = `${ads[current].ref}/navy-bucket-bag-v1.png`;
      document.getElementById("lightbox-counter").textContent = `${current + 1} / ${ads.length}`;
    }

    function onKey(e) {
      if (e.key === "ArrowRight") navigate(1);
      if (e.key === "ArrowLeft") navigate(-1);
      if (e.key === "Escape") closeLightbox();
    }
  </script>

</body>
</html>
